name: Decision support checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  decision-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test decision logic without external data or installed packages
        run: python -S -m unittest discover -s tests -p test_decision_support.py
      - name: Run clearly labelled data-free demo
        run: python -S demo_decisions.py
      - name: Check module syntax
        run: python -m compileall -q decision_support.py decision_history.py attack_chains.py match_insights.py decision_workspace_ui.py
